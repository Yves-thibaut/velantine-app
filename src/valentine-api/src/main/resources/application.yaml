server:
  port: ${SERVER_PORT:40080}

spring:
  application:
    name: valentine

# CORS : origines autorisées (frontend), séparées par des virgules
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://vl.modernworksdigital.com,http://localhost:3000,http://127.0.0.1:3000}

# Email qui reçoit la notif quand la Valentine choisit un rendez-vous
valentine:
  notification:
    recipient-email: ${VALENTINE_RECIPIENT_EMAIL:tsagueyvesthibaut@gmail.com}
    client-code: ${NOTIFICATION_CLIENT_CODE:MODERNWORKS}
    template-code: ${NOTIFICATION_TEMPLATE_CODE:VALENTINE_CHOICE}

# Service de notification (envoi email)
notification:
  http:
    base-url: ${NOTIFICATION_BASE_URL:https://notification.faroty.com/notification-service/api/v1}
    timeout: 5000

