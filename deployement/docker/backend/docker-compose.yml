networks:
  proxy:
    name: proxy-net
    external: true

services:
  valentine-api:
    build:
      context: ../../../src/valentine-api
      dockerfile: Dockerfile
    container_name: valentine-api
    restart: unless-stopped
    networks:
      - proxy
    env_file:
      - .env
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=${VIRTUAL_PORT}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:40080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
