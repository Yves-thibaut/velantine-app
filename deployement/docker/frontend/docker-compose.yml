networks:
  proxy:
    name: proxy-net
    external: true

services:
  valentine-web:
    build:
      context: ../../../src/valentine-front/valentine-web
      dockerfile: ../../../src/valentine-front/valentine-web/Dockerfile
      args:
        APP_NAME: valentine-web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: valentine-web
    restart: unless-stopped
    networks:
      - proxy
    env_file:
      - .env
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=${VIRTUAL_PORT}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
